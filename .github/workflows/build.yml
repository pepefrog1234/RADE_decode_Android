name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to release (e.g. v1.6.21). Publishes the signed release APK. Leave empty for a plain build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload debug APK for testing only
        uses: actions/upload-artifact@v4
        with:
          name: RADE_decode-debug-testing-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0

  release:
    # Never expose the production key to pull request builds.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle packages
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Restore release signing key
        env:
          RADE_RELEASE_KEYSTORE_BASE64: ${{ secrets.RADE_RELEASE_KEYSTORE_BASE64 }}
          RADE_RELEASE_STORE_PASSWORD: ${{ secrets.RADE_RELEASE_STORE_PASSWORD }}
          RADE_RELEASE_KEY_ALIAS: ${{ secrets.RADE_RELEASE_KEY_ALIAS }}
          RADE_RELEASE_KEY_PASSWORD: ${{ secrets.RADE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RADE_RELEASE_KEYSTORE_BASE64 RADE_RELEASE_STORE_PASSWORD RADE_RELEASE_KEY_ALIAS RADE_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name. See docs/signing/README.zh-TW.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$RADE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rade-release.p12"
          echo "RADE_RELEASE_STORE_FILE=$RUNNER_TEMP/rade-release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RADE_RELEASE_STORE_PASSWORD: ${{ secrets.RADE_RELEASE_STORE_PASSWORD }}
          RADE_RELEASE_KEY_ALIAS: ${{ secrets.RADE_RELEASE_KEY_ALIAS }}
          RADE_RELEASE_KEY_PASSWORD: ${{ secrets.RADE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify release APK and certificate
        run: ./scripts/verify-release-apk.sh

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RADE_decode-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release with signed APK
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          REL_APK="app/build/outputs/apk/release/app-release.apk#RADE_decode-release.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            if grep -Eq '(^|[-_])(debug|unsigned)([-_.]|$)' <<< "$EXISTING_ASSETS"; then
              echo "::error::This release contains legacy debug/unsigned APKs. Use a new tag for the signed release."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$REL_APK" --clobber
          else
            gh release create "$RELEASE_TAG" "$REL_APK" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rade-release.p12"
