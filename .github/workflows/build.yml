name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]        # pushing a vX.Y.Z tag builds and publishes a Release
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # manual release: creates the tag + Release from CI
    inputs:
      release_tag:
        description: 'Tag to release (e.g. v1.5.49). Tags the built commit and publishes a Release with the APKs. Leave empty for a plain build.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # required for gh release create on tag pushes

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RADE_decode-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: RADE_decode-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          compression-level: 0

      - name: Publish GitHub Release with APKs
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk#RADE_decode-debug.apk"
          REL_APK="app/build/outputs/apk/release/app-release-unsigned.apk#RADE_decode-release-unsigned.apk"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. drafted in the UI) — just (re)upload assets.
            gh release upload "$RELEASE_TAG" "$DEBUG_APK" "$REL_APK" --clobber
          else
            # On a manual dispatch the tag may not exist yet: gh creates it at the
            # built commit (--target), so no tag push is needed from the client.
            gh release create "$RELEASE_TAG" "$DEBUG_APK" "$REL_APK" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TAG" --generate-notes
          fi
